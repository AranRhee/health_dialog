<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>운동 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
<style>
  * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

  /* ════════ Desktop canvas ════════ */
  html, body { margin:0; padding:0; font-family:'Noto Sans KR',sans-serif; }
  body {
    background: #DCDFE6;
    background-image:
      radial-gradient(circle at 18% 22%, rgba(79,70,229,.07) 0%, transparent 48%),
      radial-gradient(circle at 82% 78%, rgba(16,185,129,.05) 0%, transparent 48%);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
  }

  /* ════════ Phone shell ════════ */
  #phone-shell {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: #F3F4F6;
    position: relative;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }

  /* Desktop chrome */
  @media (min-width: 481px) {
    body { padding: 36px 16px 52px; align-items: flex-start; }
    #phone-shell { padding: 0 6px; }
    #phone-shell #phone-notch, #phone-shell #phone-home { margin: 0 -6px; }
    #phone-shell {
      min-height: auto;
      border-radius: 44px;
      border: 1px solid rgba(0,0,0,.10);
      box-shadow:
        0 0 0 7px #fff,
        0 0 0 8px rgba(0,0,0,.07),
        0 36px 90px rgba(0,0,0,.26),
        0 8px 28px rgba(0,0,0,.14);
      overflow: hidden;
    }
    /* Notch */
    #phone-notch {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0 6px;
      background: #F3F4F6;
    }
    #phone-notch-pill {
      width: 110px; height: 26px;
      background: #1a1a2e;
      border-radius: 0 0 18px 18px;
    }
    /* Home indicator */
    #phone-home {
      display: flex;
      justify-content: center;
      padding: 10px 0 18px;
      background: #F3F4F6;
    }
    #phone-home-bar {
      width: 100px; height: 4px;
      background: rgba(0,0,0,.18);
      border-radius: 99px;
    }
    .modal-sheet { max-width: 480px !important; }
  }

  /* Mobile full-bleed */
  @media (max-width: 480px) {
    body { background: #F3F4F6; padding: 0; display: block; }
    #phone-shell { border-radius: 0; box-shadow: none; border: none; min-height: 100vh; }
    #phone-notch, #phone-home { display: none !important; }
  }

  /* ════════ Desktop inner padding ════════ */
  @media (min-width: 481px) {
    #main-app > div { padding-left: 16px !important; padding-right: 16px !important; }
    #bottom-bar { margin-left: 0; margin-right: 0; }
    #phone-shell { padding: 0; }
    #phone-shell #phone-notch, #phone-shell #phone-home { /* full width */ }
  }

  /* ════════ Landscape overlay (mobile only) ════════ */
  #landscape-overlay {
    display: none;
    position: fixed; inset: 0; z-index: 99999;
    background: #111827;
    color: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
    padding: 32px;
  }
  @media (max-width: 900px) and (orientation: landscape) {
    #landscape-overlay { display: flex; }
  }

  /* ── Tabs ── */
  .tab-pill { flex:1; padding:8px 4px; border-radius:10px; font-size:13px; font-weight:700; border:none; cursor:pointer; transition:all .18s; letter-spacing:-.01em; }
  .tab-pill.active { background:#111827; color:#fff; box-shadow:0 2px 8px rgba(17,24,39,.22); }
  .tab-pill.inactive { background:#fff; color:#6B7280; }

  /* ── Cards ── */
  .ex-card { background:#fff; border-radius:14px; box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 1px rgba(0,0,0,.04); overflow:hidden; margin-bottom:10px; position:relative; transition:box-shadow .2s; }
  .ex-card.edit-mode { box-shadow:0 1px 4px rgba(0,0,0,.07),0 0 0 2px #E0E7FF; }
  .ex-header { display:flex; align-items:center; gap:8px; padding:11px 14px 8px; border-bottom:1px solid #E5E7EB; }

  /* ── Tags ── */
  .ex-tag { font-size:10px; font-weight:700; padding:2px 7px; border-radius:20px; letter-spacing:.03em; flex-shrink:0; }
  .tag-cardio { background:#FEF3C7; color:#92400E; }
  .tag-lower   { background:#DCFCE7; color:#166534; }
  .tag-upper   { background:#FCE7F3; color:#9D174D; }
  .tag-core    { background:#E0F2FE; color:#075985; }
  .tag-etc     { background:#F3F4F6; color:#374151; }

  /* ── Set table ── */
  .set-table-head { display:grid; grid-template-columns:30px 1fr 1fr 44px; gap:6px; padding:5px 14px; background:#F9FAFB; border-bottom:1px solid #E5E7EB; }
  .set-table-head span { font-size:10px; font-weight:700; color:#9CA3AF; text-transform:uppercase; letter-spacing:.05em; text-align:center; }
  .set-table-head span:first-child { text-align:left; }

  .set-row { display:grid; grid-template-columns:30px 1fr 1fr 44px; gap:6px; align-items:center; padding:6px 14px; border-bottom:1px solid #F3F4F6; transition:background .2s; }
  .set-row:last-child { border-bottom:none; }
  .set-row.done-row { background:#F0FDF4; }
  .set-row.active-row { background:#FAFBFF; }

  .set-num { font-size:11px; font-weight:800; color:#6B7280; width:22px; height:22px; border-radius:6px; display:flex; align-items:center; justify-content:center; background:#F3F4F6; flex-shrink:0; }
  .set-num.done-num { background:#D1FAE5; color:#065F46; }
  .set-num.active-num { background:#EEF2FF; color:#4F46E5; }

  /* ── Smart Default Inputs ── */
  /*  Three visual states:
      1. .is-default  → user hasn't typed anything; we show the guide value as grey text
      2. (no class)   → user typed a real value; show black bold
      3. .is-done     → set checked; read-only green
  */
  .ul-input {
    width:100%; border:none; border-bottom:1.5px solid #E5E7EB;
    background:transparent; font-family:'Noto Sans KR',sans-serif;
    font-size:14px; padding:3px 2px 4px; text-align:center; outline:none;
    transition:border-color .15s, color .15s, font-weight .1s;
    -webkit-appearance:none; -moz-appearance:textfield;
    border-radius:0;
  }
  /* real value → bold black */
  .ul-input.is-real  { color:#111827; font-weight:700; }
  /* guide value → light grey, regular weight */
  .ul-input.is-default { color:#9CA3AF; font-weight:400; }
  /* done → green, pointer-events off, no underline */
  .ul-input.is-done { color:#16A34A; font-weight:700; pointer-events:none; border-bottom-color:transparent; }
  .ul-input:not(.is-done):focus { border-bottom-color:#4F46E5; }
  .ul-input::placeholder { color:#D1D5DB; font-weight:400; }

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; }
  input[type=number] { -moz-appearance:textfield; }

  /* ── Check circle ── */
  .check-circle { width:32px; height:32px; border-radius:50%; border:2px solid #E5E7EB; background:#F3F4F6; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .2s; margin:0 auto; font-size:15px; flex-shrink:0; }
  .check-circle.checked { background:#16A34A; border-color:#16A34A; color:#fff; box-shadow:0 2px 8px rgba(22,163,74,.3); }
  .check-circle:not(.checked):active { transform:scale(.88); }

  /* ── Difficulty chips ── */
  .chip-row { display:flex; gap:6px; padding:8px 14px 10px; }
  .chip { flex:1; padding:6px 4px; border-radius:8px; border:1.5px solid #E5E7EB; font-size:12px; font-weight:700; background:#fff; color:#6B7280; cursor:pointer; transition:all .15s; text-align:center; font-family:'Noto Sans KR',sans-serif; }
  .chip.easy.sel   { background:#D1FAE5; border-color:#10B981; color:#065F46; }
  .chip.normal.sel { background:#FEF3C7; border-color:#F59E0B; color:#78350F; }
  .chip.hard.sel   { background:#FEE2E2; border-color:#EF4444; color:#7F1D1D; }

  /* ── Modal inputs ── */
  .modal-input { width:100%; border:1.5px solid #E5E7EB; border-radius:10px; padding:10px 12px; font-family:'Noto Sans KR',sans-serif; font-size:14px; font-weight:500; color:#111827; outline:none; background:#F9FAFB; transition:border-color .15s; }
  .modal-input:focus { border-color:#4F46E5; background:#fff; }

  /* ── Progress bar ── */
  .prog-track { background:#E5E7EB; border-radius:99px; height:7px; overflow:hidden; }
  .prog-fill { height:100%; border-radius:99px; background:linear-gradient(90deg,#4F46E5 0%,#818CF8 100%); transition:width .5s cubic-bezier(.4,0,.2,1); }

  /* ── Floating Timer ── */
  #timer-float { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(0); background:#111827; color:#fff; border-radius:40px; padding:10px 20px 10px 14px; display:flex; align-items:center; gap:12px; box-shadow:0 8px 28px rgba(0,0,0,.3); z-index:999; transition:opacity .25s,transform .25s; min-width:200px; }
  #timer-float.hidden { opacity:0; pointer-events:none; transform:translateX(-50%) translateY(16px); }
  .t-ring { width:38px; height:38px; position:relative; flex-shrink:0; }
  .t-ring svg { transform:rotate(-90deg); }
  .t-ring .tbg { stroke:rgba(255,255,255,.15); }
  .t-ring .tprog { stroke:#FCD34D; stroke-linecap:round; transition:stroke-dashoffset 1s linear; }
  .t-num { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; }
  .t-close { margin-left:auto; background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:50%; width:28px; height:28px; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }

  /* ── Bottom action bar ── */
  #bottom-bar { display:flex; gap:10px; padding:16px 0 calc(16px + env(safe-area-inset-bottom)); border-top:1px solid #E5E7EB; margin-top:4px; background:#F3F4F6; }

  /* ── Desktop: clamp modal overlay to phone shell ── */
  @media (min-width:481px) { .modal-overlay { position:absolute; } }
  .btn-primary { flex:1; background:#111827; color:#fff; border:none; border-radius:12px; padding:13px 10px; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:opacity .15s,transform .1s; }
  .btn-primary:active { opacity:.85; transform:scale(.97); }
  .btn-danger-outline { background:#fff; color:#EF4444; border:1.5px solid #FECACA; border-radius:12px; padding:13px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; white-space:nowrap; transition:background .15s; }
  .btn-danger-outline:active { background:#FFF5F5; }
  .btn-edit-mode { background:#EEF2FF; color:#4F46E5; border:1.5px solid #C7D2FE; border-radius:12px; padding:13px 14px; font-size:13px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; white-space:nowrap; transition:all .15s; }
  .btn-edit-mode.active { background:#4F46E5; color:#fff; border-color:#4F46E5; }

  /* ── Edit overlay icons ── */
  .edit-actions { position:absolute; top:8px; right:8px; display:flex; gap:4px; z-index:10; }
  .icon-btn { width:28px; height:28px; border-radius:8px; border:none; display:flex; align-items:center; justify-content:center; font-size:13px; cursor:pointer; transition:all .15s; }
  .icon-btn-edit { background:#EEF2FF; color:#4F46E5; }
  .icon-btn-del  { background:#FEF2F2; color:#EF4444; }
  .icon-btn:active { transform:scale(.9); }

  /* ── Add exercise btn ── */
  .btn-add-ex { width:100%; padding:12px; border:2px dashed #C7D2FE; border-radius:14px; background:#F5F7FF; color:#4F46E5; font-size:14px; font-weight:700; cursor:pointer; font-family:'Noto Sans KR',sans-serif; transition:all .15s; margin-bottom:10px; }
  .btn-add-ex:active { background:#EEF2FF; }

  /* ── Modal ── */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:2000; display:flex; align-items:flex-end; justify-content:center; backdrop-filter:blur(2px); }
  .modal-sheet { background:#fff; border-radius:20px 20px 0 0; width:100%; max-width:512px; padding:20px 20px calc(24px + env(safe-area-inset-bottom)); max-height:92vh; overflow-y:auto; animation:slideUp .25s cubic-bezier(.4,0,.2,1); }
  @keyframes slideUp { from { transform:translateY(100%); opacity:0; } to { transform:translateY(0); opacity:1; } }
  .modal-title { font-size:17px; font-weight:900; color:#111827; margin:0 0 16px; }
  .form-label { font-size:11px; font-weight:700; color:#6B7280; text-transform:uppercase; letter-spacing:.04em; margin-bottom:6px; display:block; }
  .tag-select-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .tag-sel-btn { padding:8px 4px; border-radius:10px; border:1.5px solid #E5E7EB; background:#F9FAFB; font-size:12px; font-weight:700; color:#6B7280; cursor:pointer; text-align:center; transition:all .15s; font-family:'Noto Sans KR',sans-serif; }
  .tag-sel-btn.sel { border-color:#4F46E5; background:#EEF2FF; color:#4F46E5; }

  /* ── Settings sheet ── */
  .settings-row { display:flex; align-items:center; padding:14px 0; border-bottom:1px solid #F3F4F6; gap:12px; cursor:pointer; }
  .settings-row:last-child { border-bottom:none; }
  .settings-icon { width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }

  /* ── Toast ── */
  #toast { position:fixed; top:16px; left:50%; transform:translateX(-50%); background:#111827; color:#fff; padding:10px 20px; border-radius:40px; font-size:13px; font-weight:600; z-index:9999; opacity:0; transition:opacity .25s; white-space:nowrap; pointer-events:none; }
  #toast.show { opacity:1; }

  /* ── JSON textarea ── */
  .json-area { width:100%; border:1.5px solid #E5E7EB; border-radius:10px; padding:10px 12px; font-size:11px; font-family:monospace; color:#374151; background:#F9FAFB; resize:vertical; outline:none; min-height:120px; }
  .json-area:focus { border-color:#4F46E5; }

  /* ── Smart default legend pill ── */
  .default-legend { display:inline-flex; align-items:center; gap:4px; background:#F3F4F6; border-radius:20px; padding:3px 8px; font-size:10px; font-weight:600; color:#9CA3AF; }
</style>
</head>
<body>

<!-- Landscape overlay -->
<div id="landscape-overlay">
  <div style="font-size:52px;line-height:1;">📱</div>
  <div style="font-size:19px;font-weight:900;letter-spacing:-.02em;">세로 모드로 돌려주세요</div>
  <div style="font-size:14px;color:rgba(255,255,255,.6);max-width:260px;line-height:1.6;">
    이 앱은 세로 모드에 최적화되어 있습니다.<br>화면을 돌려주세요!
  </div>
  <div style="font-size:32px;animation:spin 2s linear infinite;display:inline-block;">🔄</div>
</div>
<style>@keyframes spin{to{transform:rotate(360deg);}}</style>

<!-- Phone shell wrapper -->
<div id="phone-shell">

  <!-- Notch (desktop only) -->
  <div id="phone-notch"><div id="phone-notch-pill"></div></div>

<div id="toast"></div>

<!-- Floating Timer -->
<div id="timer-float" class="hidden">
  <div class="t-ring">
    <svg width="38" height="38" viewBox="0 0 38 38">
      <circle class="tbg" cx="19" cy="19" r="15" fill="none" stroke-width="3.5"/>
      <circle class="tprog" id="t-prog" cx="19" cy="19" r="15" fill="none" stroke-width="3.5" stroke-dasharray="94.25" stroke-dashoffset="0"/>
    </svg>
    <div class="t-num" id="t-num">60</div>
  </div>
  <div>
    <div style="font-size:10px;color:rgba(255,255,255,.55);font-weight:600;letter-spacing:.04em;">REST</div>
    <div style="font-size:18px;font-weight:900;line-height:1;" id="t-big">01:00</div>
  </div>
  <button class="t-close" onclick="stopTimer()">✕</button>
</div>

<!-- ════════════════════════════════════════ APP ════════════════════════════════════════ -->
<div x-data="app()" x-init="init()" id="main-app">

  <div class="max-w-lg mx-auto px-3 pt-4 pb-4">

    <!-- ── Header ── -->
    <div class="flex items-center justify-between mb-3">
      <div>
        <p style="font-size:10px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;text-transform:uppercase;margin:0;">Gym Tracker</p>
        <h1 style="font-size:20px;font-weight:900;color:#111827;letter-spacing:-.03em;line-height:1.2;margin:0;">오늘의 운동</h1>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div style="background:#EEF2FF;color:#4338CA;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;" x-text="todayStr"></div>
        <button @click="settingsOpen=true" style="width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);">⚙️</button>
      </div>
    </div>

    <!-- ── Edit mode banner ── -->
    <div x-show="editMode" style="background:#EEF2FF;border:1.5px solid #C7D2FE;border-radius:12px;padding:9px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">✏️</span>
      <div>
        <div style="font-size:12px;font-weight:800;color:#3730A3;">루틴 편집 모드</div>
        <div style="font-size:11px;color:#6366F1;">운동을 추가·수정·삭제하거나 순서를 변경할 수 있어요.</div>
      </div>
    </div>

    <!-- ── Progress ── -->
    <div class="mb-4" x-show="!editMode">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;font-weight:600;color:#6B7280;">
        <span>오늘의 진행도</span>
        <span x-text="completedSets() + ' / ' + totalSets() + ' 세트'"></span>
      </div>
      <div class="prog-track"><div class="prog-fill" :style="'width:'+progressPct()+'%'"></div></div>
      <div style="font-size:10px;color:#9CA3AF;text-align:right;margin-top:2px;" x-text="progressPct()+'%'"></div>
    </div>

    <!-- ── Tabs ── -->
    <div style="display:flex;gap:6px;background:#E5E7EB;padding:4px;border-radius:13px;margin-bottom:14px;">
      <template x-for="(day, idx) in days" :key="idx">
        <button class="tab-pill" :class="activeTab===idx?'active':'inactive'" @click="activeTab=idx;saveRoutine()">
          <div x-text="day.short"></div>
          <div style="font-size:10px;font-weight:500;opacity:.7;" x-text="day.sub"></div>
        </button>
      </template>
    </div>

    <!-- ── Day subtitle ── -->
    <div style="margin-bottom:10px;">
      <p style="font-size:10px;font-weight:700;color:#6366F1;letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px;" x-text="days[activeTab].theme"></p>
      <p style="font-size:15px;font-weight:800;color:#111827;margin:0;" x-text="days[activeTab].title"></p>
    </div>

    <!-- ── Exercise Cards ── -->
    <template x-for="(ex, exIdx) in days[activeTab].exercises" :key="exIdx">
      <div class="ex-card" :class="editMode ? 'edit-mode' : ''">

        <!-- Edit mode icons -->
        <div class="edit-actions" x-show="editMode">
          <button class="icon-btn" style="background:#F3F4F6;color:#6B7280;width:22px;height:22px;border-radius:6px;font-size:11px;" :style="exIdx===0?'opacity:.3;cursor:default;':''" @click="moveEx(exIdx,-1)">▲</button>
          <button class="icon-btn" style="background:#F3F4F6;color:#6B7280;width:22px;height:22px;border-radius:6px;font-size:11px;" :style="exIdx===days[activeTab].exercises.length-1?'opacity:.3;cursor:default;':''" @click="moveEx(exIdx,1)">▼</button>
          <button class="icon-btn icon-btn-edit" @click="openEditModal(exIdx)">✎</button>
          <button class="icon-btn icon-btn-del" @click="deleteEx(exIdx)">✕</button>
        </div>

        <!-- ── Cardio ── -->
        <template x-if="ex.sets === 0">
          <div>
            <div class="ex-header" :style="editMode?'padding-right:120px;':''">
              <span class="ex-tag" :class="ex.tagClass" x-text="ex.tag"></span>
              <span style="font-size:13px;font-weight:700;color:#111827;" x-text="ex.name"></span>
            </div>
            <div style="padding:9px 14px;display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:12px;color:#6B7280;" x-text="ex.note||'유산소'"></span>
              <span style="font-size:11px;background:#FEF9C3;color:#854D0E;padding:3px 9px;border-radius:20px;font-weight:700;">유산소</span>
            </div>
          </div>
        </template>

        <!-- ── Strength ── -->
        <template x-if="ex.sets > 0">
          <div>
            <!-- Card header -->
            <div class="ex-header" :style="editMode?'padding-right:120px;':''">
              <span class="ex-tag" :class="ex.tagClass" x-text="ex.tag"></span>

<script>
/* ════════════ Timer ════════════ */
const CIRC = 2*Math.PI*15;
let timerInterval=null, timerSecs=60;
function startTimer(){
  stopTimer(); timerSecs=60; updateTimerUI();
  document.getElementById('timer-float').classList.remove('hidden');
  timerInterval=setInterval(()=>{
    timerSecs--;
    if(timerSecs<=0){ timerSecs=0; updateTimerUI(); stopTimer(); if(navigator.vibrate)navigator.vibrate([150,80,150]); }
    else updateTimerUI();
  },1000);
}
function stopTimer(){
  if(timerInterval){clearInterval(timerInterval);timerInterval=null;}
  document.getElementById('timer-float').classList.add('hidden');
}
function updateTimerUI(){
  const pct=timerSecs/60;
  document.getElementById('t-prog').style.strokeDashoffset=CIRC*(1-pct);
  document.getElementById('t-num').textContent=timerSecs;
  const m=String(Math.floor(timerSecs/60)).padStart(2,'0'), s=String(timerSecs%60).padStart(2,'0');
  document.getElementById('t-big').textContent=m+':'+s;
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2400);
}

    label:'금요일',short:'금요일',sub:'Balance',title:'하체 & 어깨 후면',theme:'Balance Day',
    exercises:[
      {name:'좌식 사이클',tag:'유산소',tagClass:'tag-cardio',reps:0,sets:0,note:'15분'},
      {name:'힙 어덕션 (안쪽)',tag:'하체',tagClass:'tag-lower',reps:20,sets:3,note:'',defaultWeight:0,defaultReps:20},
      {name:'시티드 레그 컬',tag:'하체',tagClass:'tag-lower',reps:15,sets:3,note:'무릎 뒤쪽 근육을 강화하여 관절을 보호합니다.',defaultWeight:0,defaultReps:15},
      {name:'리어 델토이드',tag:'어깨',tagClass:'tag-upper',reps:15,sets:3,note:'어깨 후면과 등 상부를 함께 강화합니다.',defaultWeight:0,defaultReps:15},
      {name:'덤벨 스쿼트',tag:'전신',tagClass:'tag-lower',reps:12,sets:3,note:'덤벨을 가슴 앞에 들고 허리를 세운 채 내려갑니다.',defaultWeight:0,defaultReps:12},
      {name:'크런치 머신',tag:'복근',tagClass:'tag-core',reps:20,sets:3,note:'',defaultWeight:0,defaultReps:20},
      {name:'좌식 사이클',tag:'유산소',tagClass:'tag-cardio',reps:0,sets:0,note:'30분, 일정한 속도로 체지방 연소'},
    ]
  }
];

/* ════════════ Alpine App ════════════ */
function app(){
  const TODAY=new Date();
  const DOW=TODAY.getDay();
  const tabMap={1:0,3:1,5:2};
  const defaultTab=tabMap[DOW]!==undefined?tabMap[DOW]:0;
  const dateKey=TODAY.toISOString().slice(0,10);

  const TAG_OPTIONS=[
    {value:'하체',label:'하체',emoji:'🦵',cls:'tag-lower'},
    {value:'가슴',label:'가슴',emoji:'💪',cls:'tag-upper'},
    {value:'등',label:'등',emoji:'🔙',cls:'tag-upper'},
    {value:'어깨',label:'어깨',emoji:'🏋️',cls:'tag-upper'},
    {value:'팔/복근',label:'팔/복근',emoji:'💥',cls:'tag-core'},
    {value:'유산소',label:'유산소',emoji:'🚴',cls:'tag-cardio'},
    {value:'전신',label:'전신',emoji:'⚡',cls:'tag-lower'},
    {value:'복근',label:'복근',emoji:'🎯',cls:'tag-core'},
    {value:'기타',label:'기타',emoji:'➕',cls:'tag-etc'},
  ];

  return {
    days:[],
    activeTab:defaultTab,
    todayStr:TODAY.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'short'}),
    workoutData:{},
    /* smartDefaults: per-exercise dynamic carry-over value
       key: "dayIdx_exIdx" → {weight: number|null, reps: number|null}  */
    smartDefaults:{},
    editMode:false,
    tagOptions:TAG_OPTIONS,
    modalOpen:false,
    modalEditIdx:-1,
    modalForm:{name:'',tag:'하체',tagClass:'tag-lower',sets:3,reps:12,defaultWeight:'',defaultReps:'',note:''},
    settingsOpen:false,
    jsonPanelOpen:false,
    jsonMode:'export',
    jsonText:'',

    /* ── init ── */
    init(){
      const savedRoutine=localStorage.getItem('wt3_routine');
      this.days=savedRoutine?JSON.parse(savedRoutine):JSON.parse(JSON.stringify(DEFAULT_DAYS));
      const saved=localStorage.getItem('wt3_'+dateKey);
      if(saved){try{this.workoutData=JSON.parse(saved);}catch(e){}}
      const savedDef=localStorage.getItem('wt3_def_'+dateKey);
      if(savedDef){try{this.smartDefaults=JSON.parse(savedDef);}catch(e){}}
      const savedTab=localStorage.getItem('wt3_tab_'+dateKey);
      if(savedTab!==null)this.activeTab=parseInt(savedTab);
    },

    /* ── storage ── */
    key(d,e,f){return d+'_'+e+'_'+f;},
    getData(d,e,f){return this.workoutData[this.key(d,e,f)]||'';},
    setData(d,e,f,v){this.workoutData[this.key(d,e,f)]=v;this.saveWorkout();},

    saveWorkout(){
      localStorage.setItem('wt3_'+dateKey,JSON.stringify(this.workoutData));
      localStorage.setItem('wt3_def_'+dateKey,JSON.stringify(this.smartDefaults));
      localStorage.setItem('wt3_tab_'+dateKey,this.activeTab);
    },
    saveRoutine(){
      localStorage.setItem('wt3_routine',JSON.stringify(this.days));
      localStorage.setItem('wt3_tab_'+dateKey,this.activeTab);
    },

    /* ── Smart Default helpers ── */
    defKey(d,e){return d+'_'+e;},

    /* Get the effective default weight for a set:
       priority: smartDefaults (carry-over) → ex.defaultWeight → null */
    effectiveDefaultWeight(d,e){
      const ex=this.days[d].exercises[e];
      const sd=this.smartDefaults[this.defKey(d,e)];
      if(sd && sd.weight!=null && sd.weight!=='') return sd.weight;
      if(ex.defaultWeight!=null && ex.defaultWeight!=='') return ex.defaultWeight;
      return null;
    },
    effectiveDefaultReps(d,e){
      const ex=this.days[d].exercises[e];
      const sd=this.smartDefaults[this.defKey(d,e)];
      if(sd && sd.reps!=null && sd.reps!=='') return sd.reps;
      if(ex.defaultReps!=null && ex.defaultReps!=='') return ex.defaultReps;
      return null;
    },

    /* What value to show in the weight input for set s */
    getDisplayWeight(d,e,s){
      const real=this.getData(d,e,'weight_'+s);
      if(real!=='') return real;
      const def=this.effectiveDefaultWeight(d,e);
      return (def!=null && def!==0 && def!=='') ? def : '';
    },
    getDisplayReps(d,e,s){
      const real=this.getData(d,e,'reps_'+s);
      if(real!=='') return real;
      const ex=this.days[d].exercises[e];
      const sd=this.smartDefaults[this.defKey(d,e)];
      // reps default: smartDefault reps → ex.defaultReps → ex.reps (target)
      if(sd && sd.reps!=null && sd.reps!=='') return sd.reps;
      if(ex.defaultReps!=null && ex.defaultReps!=='') return ex.defaultReps;
      if(ex.reps) return ex.reps;
      return '';
    },

    /* Which set index is the next uncompleted set (for highlight) */
    getActiveSet(d,e){
      const ex=this.days[d].exercises[e];
      for(let s=0;s<ex.sets;s++){
        if(!this.workoutData[this.key(d,e,'set_'+s)]) return s;
      }
      return -1;
    },

    getSetDone(d,e,s){
      return !!this.workoutData[this.key(d,e,'set_'+s)];
    },

    /* ── Input event handlers ── */
    onInputFocus(ev, d, e, s, field){
      // Select all text on focus for easy overwrite
      ev.target.select();
    },

    onWeightInput(ev, d, e, s){
      const val=ev.target.value;
      this.setData(d,e,'weight_'+s, val);
    },
    onRepsInput(ev, d, e, s){
      const val=ev.target.value;
      this.setData(d,e,'reps_'+s, val);
    },

    onInputBlur(ev, d, e, s, field){
      // If user cleared the field, remove the stored value so it shows default again
      if(ev.target.value==='' || ev.target.value===null){
        this.workoutData[this.key(d,e,(field==='weight'?'weight_':'reps_')+s)]='';
        this.saveWorkout();
      }
    },

    /* ── Toggle set completion + carry-over logic ── */
    toggleSet(d,e,s,ex){
      const k=this.key(d,e,'set_'+s);
      const nowDone=!this.workoutData[k];
      this.workoutData[k]=nowDone;

      if(nowDone){
        // Resolve the actual weight and reps used for this set
        const usedWeight = this.getData(d,e,'weight_'+s) || this.getDisplayWeight(d,e,s);
        const usedReps   = this.getData(d,e,'reps_'+s)   || this.getDisplayReps(d,e,s);

        // Commit those values as real data so they persist even if no explicit input
        if(this.getData(d,e,'weight_'+s)==='') this.workoutData[this.key(d,e,'weight_'+s)]=usedWeight;
        if(this.getData(d,e,'reps_'+s)==='')   this.workoutData[this.key(d,e,'reps_'+s)]=usedReps;

        // ★ Carry-over: update smartDefaults for subsequent undone sets
        const defK=this.defKey(d,e);
        if(!this.smartDefaults[defK]) this.smartDefaults[defK]={};
        this.smartDefaults[defK].weight = usedWeight!=='' ? usedWeight : this.smartDefaults[defK].weight;
        this.smartDefaults[defK].reps   = usedReps!==''   ? usedReps   : this.smartDefaults[defK].reps;

        startTimer();
      } else {
        stopTimer();
      }
      this.saveWorkout();
    },

    /* ── Progress ── */
    completedSets(){
      let c=0;
      this.days[this.activeTab].exercises.forEach((ex,ei)=>{
        for(let s=0;s<ex.sets;s++) if(this.workoutData[this.key(this.activeTab,ei,'set_'+s)]) c++;
      });
      return c;
    },
    totalSets(){return this.days[this.activeTab].exercises.reduce((a,ex)=>a+ex.sets,0);},
    progressPct(){const t=this.totalSets();return t>0?Math.round(this.completedSets()/t*100):0;},

    /* ── Edit mode ── */
    toggleEditMode(){this.editMode=!this.editMode;if(!this.editMode)stopTimer();},

    /* ── Modal ── */
    openAddModal(){
      this.modalEditIdx=-1;
      this.modalForm={name:'',tag:'하체',tagClass:'tag-lower',sets:3,reps:12,defaultWeight:'',defaultReps:'',note:''};
      this.modalOpen=true;
    },
    openEditModal(exIdx){
      this.modalEditIdx=exIdx;
      const ex=this.days[this.activeTab].exercises[exIdx];
      this.modalForm={
        name:ex.name,tag:ex.tag,tagClass:ex.tagClass,
        sets:ex.sets,reps:ex.reps,
        defaultWeight:ex.defaultWeight||'',
        defaultReps:ex.defaultReps||'',
        note:ex.note||''
      };
      this.modalOpen=true;
    },
    saveModal(){
      if(!this.modalForm.name.trim()) return;
      const found=this.tagOptions.find(o=>o.value===this.modalForm.tag);
      const entry={
        name:this.modalForm.name.trim(),
        tag:this.modalForm.tag,
        tagClass:found?found.cls:'tag-etc',
        reps:this.modalForm.reps,
        sets:this.modalForm.sets,
        defaultWeight:this.modalForm.defaultWeight!==''?Number(this.modalForm.defaultWeight):null,
        defaultReps:this.modalForm.defaultReps!==''?Number(this.modalForm.defaultReps):null,
        note:this.modalForm.note.trim()
      };
      if(this.modalEditIdx===-1){
        this.days[this.activeTab].exercises.push(entry);
        showToast('✅ 운동이 추가되었어요!');
      } else {
        this.days[this.activeTab].exercises[this.modalEditIdx]=entry;
        showToast('✅ 수정되었어요!');
      }
      this.saveRoutine();
      this.modalOpen=false;
    },

    deleteEx(exIdx){
      if(!confirm('이 운동을 삭제할까요?')) return;
      this.days[this.activeTab].exercises.splice(exIdx,1);
      this.saveRoutine();
      showToast('🗑 삭제되었어요.');
    },
    moveEx(exIdx,dir){
      const arr=this.days[this.activeTab].exercises;
      const newIdx=exIdx+dir;
      if(newIdx<0||newIdx>=arr.length) return;
      [arr[exIdx],arr[newIdx]]=[arr[newIdx],arr[exIdx]];
      this.saveRoutine();
    },

    /* ── Copy to clipboard ── */
    copyToClipboard(){
      const day=this.days[this.activeTab];
      let lines=[];
      lines.push('📅 '+this.todayStr+' 운동 기록');
      lines.push('📌 '+day.title+' ('+day.theme+')');
      lines.push('');
      day.exercises.forEach((ex,ei)=>{
        lines.push('▶ '+ex.name+' ['+ex.tag+']');
        if(ex.sets>0){
          let doneCount=0;
          for(let s=0;s<ex.sets;s++){
            const done=!!this.workoutData[this.key(this.activeTab,ei,'set_'+s)];
            // Use real stored value; if absent, fall back to display value (which includes defaults)
            const w=this.getData(this.activeTab,ei,'weight_'+s)||this.getDisplayWeight(this.activeTab,ei,s);
            const r=this.getData(this.activeTab,ei,'reps_'+s)||this.getDisplayReps(this.activeTab,ei,s);
            if(done) doneCount++;
            const wLabel=w!==''&&w!==null?w+'kg':'-';
            const rLabel=r!==''&&r!==null?r+'회':'-';
            lines.push('  세트'+(s+1)+': '+wLabel+' / '+rLabel+' '+(done?'✓':'○'));
          }
          lines.push('  완료: '+doneCount+'/'+ex.sets+'세트');
          const fb=this.getData(this.activeTab,ei,'feedback');
          if(fb) lines.push('  난이도: '+fb);
        } else {
          lines.push('  → '+(ex.note||'유산소'));
        }
        lines.push('');
      });
      lines.push('─────────────────');
      lines.push('총 완료: '+this.completedSets()+' / '+this.totalSets()+'세트 ('+this.progressPct()+'%)');
      navigator.clipboard.writeText(lines.join('\n'))
        .then(()=>showToast('✅ 클립보드에 복사됐어요!'))
        .catch(()=>showToast('❌ 복사 실패 — 직접 선택해 주세요'));
    },

    resetConfirm(){
      if(confirm('오늘 기록을 모두 초기화할까요?')){
        this.workoutData={};
        this.smartDefaults={};
        this.saveWorkout();
        stopTimer();
        showToast('🗑 초기화 완료');
      }
    },

    exportJSON(){return JSON.stringify(this.days,null,2);},
    copyJSON(){
      navigator.clipboard.writeText(this.jsonText)
        .then(()=>showToast('📋 JSON이 복사됐어요!'))
        .catch(()=>showToast('❌ 복사 실패'));
    },
    importJSON(){
      try{
        const parsed=JSON.parse(this.jsonText);
        if(!Array.isArray(parsed)) throw new Error('배열 형식이어야 합니다.');
        this.days=parsed;
        this.saveRoutine();
        this.jsonPanelOpen=false;
        this.settingsOpen=false;
        showToast('✅ 루틴을 가져왔어요!');
      }catch(e){
        showToast('❌ JSON 형식 오류: '+e.message);
      }
    },
    resetRoutineConfirm(){
      if(confirm('기본 루틴으로 초기화할까요? 커스텀 운동이 모두 삭제됩니다.')){
        this.days=JSON.parse(JSON.stringify(DEFAULT_DAYS));
        this.saveRoutine();
        this.settingsOpen=false;
        showToast('🔄 기본 루틴으로 초기화했어요.');
      }
    }
  };
}
</script>
