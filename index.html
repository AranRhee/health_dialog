<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>운동 트래커</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/alpinejs/3.13.5/cdn.min.js" defer></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Landscape overlay -->
<div id="landscape-overlay">
  <div style="font-size:52px;line-height:1;">📱</div>
  <div style="font-size:19px;font-weight:900;letter-spacing:-.02em;">세로 모드로 돌려주세요</div>
  <div style="font-size:14px;color:rgba(255,255,255,.6);max-width:260px;line-height:1.6;">
    이 앱은 세로 모드에 최적화되어 있습니다.<br>화면을 돌려주세요!
  </div>
  <div style="font-size:32px;animation:spin 2s linear infinite;display:inline-block;">🔄</div>
</div>

<!-- Phone shell wrapper -->
<div id="phone-shell">

  <!-- Notch (desktop only) -->
  <div id="phone-notch"><div id="phone-notch-pill"></div></div>

<div id="toast"></div>

<!-- Floating Timer -->
<div id="timer-float" class="hidden">
  <div class="t-ring">
    <svg width="38" height="38" viewBox="0 0 38 38">
      <circle class="tbg" cx="19" cy="19" r="15" fill="none" stroke-width="3.5"/>
      <circle class="tprog" id="t-prog" cx="19" cy="19" r="15" fill="none" stroke-width="3.5" stroke-dasharray="94.25" stroke-dashoffset="0"/>
    </svg>
    <div class="t-num" id="t-num">60</div>
  </div>
  <div>
    <div style="font-size:10px;color:rgba(255,255,255,.55);font-weight:600;letter-spacing:.04em;">REST</div>
    <div style="font-size:18px;font-weight:900;line-height:1;" id="t-big">01:00</div>
  </div>
  <button class="t-close" onclick="stopTimer()">✕</button>
</div>

<!-- ════════════════════════════════════════ APP ════════════════════════════════════════ -->
<div x-data="app()" x-init="init()" id="main-app">

  <div class="max-w-lg mx-auto px-4 pt-4 pb-4">

    <!-- ── Header ── -->
    <div class="flex items-center justify-between mb-3">
      <div>
        <p style="font-size:10px;font-weight:700;color:#9CA3AF;letter-spacing:.08em;text-transform:uppercase;margin:0;">Gym Tracker</p>
        <h1 style="font-size:20px;font-weight:900;color:#111827;letter-spacing:-.03em;line-height:1.2;margin:0;">오늘의 운동</h1>
      </div>
      <div style="display:flex;gap:8px;align-items:center;">
        <div style="background:#EEF2FF;color:#4338CA;font-size:11px;font-weight:700;padding:5px 11px;border-radius:20px;" x-text="todayStr"></div>
        <button @click="settingsOpen=true" style="width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid #E5E7EB;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06);">⚙️</button>
      </div>
    </div>

    <!-- ── Edit mode banner ── -->
    <div x-show="editMode" style="background:#EEF2FF;border:1.5px solid #C7D2FE;border-radius:12px;padding:9px 14px;margin-bottom:12px;display:flex;align-items:center;gap:8px;">
      <span style="font-size:14px;">✏️</span>
      <div>
        <div style="font-size:12px;font-weight:800;color:#3730A3;">루틴 편집 모드</div>
        <div style="font-size:11px;color:#6366F1;">운동을 추가·수정·삭제하거나 순서를 변경할 수 있어요.</div>
      </div>
    </div>

    <!-- ── Progress ── -->
    <div class="mb-4" x-show="!editMode">
      <div style="display:flex;justify-content:space-between;margin-bottom:4px;font-size:11px;font-weight:600;color:#6B7280;">
        <span>오늘의 진행도</span>
        <span x-text="completedSets() + ' / ' + totalSets() + ' 세트'"></span>
      </div>
      <div class="prog-track"><div class="prog-fill" :style="'width:'+progressPct()+'%'"></div></div>
      <div style="font-size:10px;color:#9CA3AF;text-align:right;margin-top:2px;" x-text="progressPct()+'%'"></div>
    </div>

    <!-- ── Tabs ── -->
    <div style="display:flex;gap:6px;background:#E5E7EB;padding:4px;border-radius:13px;margin-bottom:14px;">
      <template x-for="(day, idx) in days" :key="idx">
        <button class="tab-pill" :class="activeTab===idx?'active':'inactive'" @click="activeTab=idx;saveRoutine()">
          <div x-text="day.short"></div>
          <div style="font-size:10px;font-weight:500;opacity:.7;" x-text="day.sub"></div>
        </button>
      </template>
    </div>

    <!-- ── Day subtitle ── -->
    <div style="margin-bottom:10px;">
      <p style="font-size:10px;font-weight:700;color:#6366F1;letter-spacing:.04em;text-transform:uppercase;margin:0 0 2px;" x-text="days[activeTab].theme"></p>
      <p style="font-size:15px;font-weight:800;color:#111827;margin:0;" x-text="days[activeTab].title"></p>
    </div>

    <!-- ── Exercise Cards ── -->
    <template x-for="(ex, exIdx) in days[activeTab].exercises" :key="exIdx">
      <div class="ex-card" :class="editMode ? 'edit-mode' : ''">

        <!-- Edit mode icons -->
        <div class="edit-actions" x-show="editMode">
          <button class="icon-btn" style="background:#F3F4F6;color:#6B7280;width:22px;height:22px;border-radius:6px;font-size:11px;" :style="exIdx===0?'opacity:.3;cursor:default;':''" @click="moveEx(exIdx,-1)">▲</button>
          <button class="icon-btn" style="background:#F3F4F6;color:#6B7280;width:22px;height:22px;border-radius:6px;font-size:11px;" :style="exIdx===days[activeTab].exercises.length-1?'opacity:.3;cursor:default;':''" @click="moveEx(exIdx,1)">▼</button>
          <button class="icon-btn icon-btn-edit" @click="openEditModal(exIdx)">✎</button>
          <button class="icon-btn icon-btn-del" @click="deleteEx(exIdx)">✕</button>
        </div>

        <!-- ── Cardio ── -->
        <template x-if="ex.sets === 0">
          <div>
            <div class="ex-header" :style="editMode?'padding-right:120px;':''">
              <span class="ex-tag" :class="ex.tagClass" x-text="ex.tag"></span>
              <span style="font-size:13px;font-weight:700;color:#111827;" x-text="ex.name"></span>
            </div>
            <div style="padding:9px 14px;display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:12px;color:#6B7280;" x-text="ex.note||'유산소'"></span>
              <span style="font-size:11px;background:#FEF9C3;color:#854D0E;padding:3px 9px;border-radius:20px;font-weight:700;">유산소</span>
            </div>
          </div>
        </template>

        <!-- ── Strength ── -->
        <template x-if="ex.sets > 0">
          <div>
            <!-- Card header -->
            <div class="ex-header" :style="editMode?'padding-right:120px;':''">
              <span class="ex-tag" :class="ex.tagClass" x-text="ex.tag"></span>
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:700;color:#111827;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;" x-text="ex.name"></div>
                <div style="font-size:10px;color:#9CA3AF;margin-top:1px;" x-text="ex.note" x-show="ex.note"></div>
              </div>
              <!-- Workout mode: show target + smart default legend -->
              <div style="flex-shrink:0;text-align:right;" x-show="!editMode">
                <div style="font-size:10px;color:#9CA3AF;font-weight:600;">목표</div>
                <div style="font-size:12px;font-weight:800;color:#4F46E5;" x-text="ex.reps+'회×'+ex.sets+'set'"></div>
              </div>
            </div>

            <!-- Smart default hint bar -->
            <div x-show="!editMode" style="padding:5px 14px 0;display:flex;align-items:center;justify-content:flex-end;gap:6px;">
              <span class="default-legend">
                <span style="display:inline-block;width:8px;height:8px;background:#D1D5DB;border-radius:2px;"></span>
                회색 = 기본값 (터치해서 수정)
              </span>
            </div>

            <!-- Table head -->
            <div class="set-table-head" x-show="!editMode" style="margin-top:6px;">
              <span>SET</span><span>kg</span><span>reps</span><span>완료</span>
            </div>

            <!-- Set rows (workout mode) -->
            <template x-if="!editMode">
              <div>
                <template x-for="s in ex.sets" :key="s">
                  <div class="set-row"
                    :class="getSetDone(activeTab,exIdx,s-1) ? 'done-row' : (getActiveSet(activeTab,exIdx)===s-1 ? 'active-row' : '')">

                    <!-- Set number badge -->
                    <div class="set-num"
                      :class="getSetDone(activeTab,exIdx,s-1) ? 'done-num' : (getActiveSet(activeTab,exIdx)===s-1 ? 'active-num' : '')">
                      <span x-show="getSetDone(activeTab,exIdx,s-1)">✓</span>
                      <span x-show="!getSetDone(activeTab,exIdx,s-1)" x-text="s"></span>
                    </div>

                    <!-- Weight input -->
                    <input
                      type="number" inputmode="decimal"
                      class="ul-input"
                      :class="getSetDone(activeTab,exIdx,s-1) ? 'is-done' : (getData(activeTab,exIdx,'weight_'+(s-1)) ? 'is-real' : 'is-default')"
                      :value="getDisplayWeight(activeTab,exIdx,s-1)"
                      :readonly="getSetDone(activeTab,exIdx,s-1)"
                      @focus="onInputFocus($event, activeTab, exIdx, s-1, 'weight')"
                      @input="onWeightInput($event, activeTab, exIdx, s-1)"
                      @blur="onInputBlur($event, activeTab, exIdx, s-1, 'weight')">

                    <!-- Reps input -->
                    <input
                      type="number" inputmode="numeric"
                      class="ul-input"
                      :class="getSetDone(activeTab,exIdx,s-1) ? 'is-done' : (getData(activeTab,exIdx,'reps_'+(s-1)) ? 'is-real' : 'is-default')"
                      :value="getDisplayReps(activeTab,exIdx,s-1)"
                      :readonly="getSetDone(activeTab,exIdx,s-1)"
                      @focus="onInputFocus($event, activeTab, exIdx, s-1, 'reps')"
                      @input="onRepsInput($event, activeTab, exIdx, s-1)"
                      @blur="onInputBlur($event, activeTab, exIdx, s-1, 'reps')">

                    <!-- Check circle -->
                    <div class="check-circle" :class="getSetDone(activeTab,exIdx,s-1)?'checked':''"
                      @click="toggleSet(activeTab,exIdx,s-1,ex)">
                      <span x-show="getSetDone(activeTab,exIdx,s-1)">✓</span>
                    </div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Edit mode summary -->
            <template x-if="editMode">
              <div style="padding:10px 14px;display:flex;gap:10px;align-items:center;">
                <div style="flex:1;background:#F9FAFB;border-radius:8px;padding:6px 10px;text-align:center;">
                  <div style="font-size:10px;font-weight:600;color:#9CA3AF;margin-bottom:2px;">세트</div>
                  <div style="font-size:16px;font-weight:900;color:#111827;" x-text="ex.sets"></div>
                </div>
                <div style="color:#D1D5DB;font-size:16px;">×</div>
                <div style="flex:1;background:#F9FAFB;border-radius:8px;padding:6px 10px;text-align:center;">
                  <div style="font-size:10px;font-weight:600;color:#9CA3AF;margin-bottom:2px;">목표 횟수</div>
                  <div style="font-size:16px;font-weight:900;color:#111827;" x-text="ex.reps+'회'"></div>
                </div>
                <template x-if="ex.defaultWeight">
                  <div style="flex:1;background:#F9FAFB;border-radius:8px;padding:6px 10px;text-align:center;">
                    <div style="font-size:10px;font-weight:600;color:#9CA3AF;margin-bottom:2px;">기본 무게</div>
                    <div style="font-size:16px;font-weight:900;color:#111827;" x-text="ex.defaultWeight+'kg'"></div>
                  </div>
                </template>
              </div>
            </template>

            <!-- Difficulty chips -->
            <div class="chip-row" x-show="!editMode">
              <button class="chip easy" :class="getData(activeTab,exIdx,'feedback')==='쉬움'?'sel':''"
                @click="setData(activeTab,exIdx,'feedback',getData(activeTab,exIdx,'feedback')==='쉬움'?'':'쉬움')">😌 쉬움</button>
              <button class="chip normal" :class="getData(activeTab,exIdx,'feedback')==='보통'?'sel':''"
                @click="setData(activeTab,exIdx,'feedback',getData(activeTab,exIdx,'feedback')==='보통'?'':'보통')">💪 보통</button>
              <button class="chip hard" :class="getData(activeTab,exIdx,'feedback')==='어려움'?'sel':''"
                @click="setData(activeTab,exIdx,'feedback',getData(activeTab,exIdx,'feedback')==='어려움'?'':'어려움')">🔥 어려움</button>
            </div>
          </div>
        </template>
      </div>
    </template>

    <!-- Add exercise btn (edit mode) -->
    <button class="btn-add-ex" x-show="editMode" @click="openAddModal()">＋ 이 날에 운동 추가하기</button>

    <!-- ── Bottom action bar ── -->
    <div id="bottom-bar">
      <template x-if="!editMode">
        <button class="btn-primary" @click="copyToClipboard()">📋 기록 복사 (AI 분석용)</button>
      </template>
      <template x-if="editMode">
        <button class="btn-primary" @click="openAddModal()">＋ 운동 추가</button>
      </template>
      <template x-if="!editMode">
        <button class="btn-danger-outline" @click="resetConfirm()">🗑 초기화</button>
      </template>
      <button class="btn-edit-mode" :class="editMode ? 'active' : ''" @click="toggleEditMode()">
        <span x-text="editMode ? '✓ 완료' : '✏️ 편집'"></span>
      </button>
    </div>

  </div><!-- /scroll area -->


  <!-- ════════════ MODAL: Add / Edit Exercise ════════════ -->
  <div class="modal-overlay" x-show="modalOpen" @click.self="modalOpen=false" style="display:none;">
    <div class="modal-sheet" @click.stop>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
        <h2 class="modal-title" style="margin:0;" x-text="modalEditIdx===-1?'운동 추가':'운동 수정'"></h2>
        <button @click="modalOpen=false" style="width:30px;height:30px;border-radius:50%;background:#F3F4F6;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6B7280;">✕</button>
      </div>

      <!-- 운동 명칭 -->
      <div style="margin-bottom:14px;">
        <label class="form-label">운동 명칭 *</label>
        <input type="text" class="modal-input" placeholder="예: 벤치 프레스" x-model="modalForm.name">
      </div>

      <!-- 운동 부위 -->
      <div style="margin-bottom:14px;">
        <label class="form-label">운동 부위</label>
        <div class="tag-select-grid">
          <template x-for="opt in tagOptions" :key="opt.value">
            <button class="tag-sel-btn" :class="modalForm.tag===opt.value?'sel':''" @click="modalForm.tag=opt.value;modalForm.tagClass=opt.cls">
              <span x-text="opt.emoji"></span> <span x-text="opt.label"></span>
            </button>
          </template>
        </div>
      </div>

      <!-- 운동 유형 -->
      <div style="margin-bottom:14px;">
        <label class="form-label">운동 유형</label>
        <div style="display:flex;gap:8px;">
          <button class="tag-sel-btn" :class="modalForm.sets===0?'sel':''" @click="modalForm.sets=0;modalForm.reps=0" style="flex:1;">🚴 유산소</button>
          <button class="tag-sel-btn" :class="modalForm.sets>0?'sel':''" @click="if(modalForm.sets===0){modalForm.sets=3;modalForm.reps=12;}" style="flex:1;">🏋️ 근력</button>
        </div>
      </div>

      <!-- Sets / Reps -->
      <template x-if="modalForm.sets > 0">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
          <div>
            <label class="form-label">목표 세트</label>
            <div style="display:flex;align-items:center;gap:8px;">
              <button @click="modalForm.sets=Math.max(1,modalForm.sets-1)" style="width:32px;height:32px;border-radius:8px;border:1.5px solid #E5E7EB;background:#F9FAFB;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#374151;">−</button>
              <span style="font-size:20px;font-weight:900;color:#111827;min-width:24px;text-align:center;" x-text="modalForm.sets"></span>
              <button @click="modalForm.sets=Math.min(10,modalForm.sets+1)" style="width:32px;height:32px;border-radius:8px;border:1.5px solid #E5E7EB;background:#F9FAFB;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#374151;">＋</button>
            </div>
          </div>
          <div>
            <label class="form-label">목표 횟수</label>
            <div style="display:flex;align-items:center;gap:8px;">
              <button @click="modalForm.reps=Math.max(1,modalForm.reps-1)" style="width:32px;height:32px;border-radius:8px;border:1.5px solid #E5E7EB;background:#F9FAFB;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#374151;">−</button>
              <span style="font-size:20px;font-weight:900;color:#111827;min-width:24px;text-align:center;" x-text="modalForm.reps"></span>
              <button @click="modalForm.reps=Math.min(100,modalForm.reps+1)" style="width:32px;height:32px;border-radius:8px;border:1.5px solid #E5E7EB;background:#F9FAFB;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#374151;">＋</button>
            </div>
          </div>
        </div>
      </template>

      <!-- ★ Smart Default: 기본 무게 / 기본 횟수 -->
      <template x-if="modalForm.sets > 0">
        <div style="background:#F0F9FF;border:1.5px solid #BAE6FD;border-radius:12px;padding:12px 14px;margin-bottom:14px;">
          <div style="font-size:11px;font-weight:800;color:#0369A1;margin-bottom:10px;display:flex;align-items:center;gap:5px;">
            <span>⚡</span> 스마트 기본값 (선택)
          </div>
          <div style="font-size:11px;color:#0284C7;margin-bottom:10px;line-height:1.5;">
            입력 없이 완료 버튼을 누르면 이 값이 자동으로 기록됩니다.
          </div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;">
            <div>
              <label class="form-label" style="color:#0369A1;">기본 무게 (kg)</label>
              <input type="number" inputmode="decimal" class="modal-input" placeholder="예: 60"
                x-model.number="modalForm.defaultWeight"
                style="background:#fff;">
            </div>
            <div>
              <label class="form-label" style="color:#0369A1;">기본 횟수</label>
              <input type="number" inputmode="numeric" class="modal-input" placeholder="예: 12"
                x-model.number="modalForm.defaultReps"
                style="background:#fff;">
            </div>
          </div>
        </div>
      </template>

      <!-- 주의사항/설명 -->
      <div style="margin-bottom:20px;">
        <label class="form-label">주의사항 / 설명</label>
        <input type="text" class="modal-input" placeholder="예: 허리를 세우고 천천히 수행합니다." x-model="modalForm.note">
      </div>

      <button @click="saveModal()" :disabled="!modalForm.name.trim()"
        style="width:100%;padding:14px;border-radius:12px;border:none;font-family:'Noto Sans KR',sans-serif;font-size:15px;font-weight:800;cursor:pointer;transition:all .15s;"
        :style="modalForm.name.trim()?'background:#111827;color:#fff;':'background:#E5E7EB;color:#9CA3AF;cursor:not-allowed;'">
        <span x-text="modalEditIdx===-1?'추가하기':'저장하기'"></span>
      </button>
    </div>
  </div>


  <!-- ════════════ SETTINGS SHEET ════════════ -->
  <div class="modal-overlay" x-show="settingsOpen" @click.self="settingsOpen=false" style="display:none;">
    <div class="modal-sheet" @click.stop>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;">
        <h2 class="modal-title" style="margin:0;">설정</h2>
        <button @click="settingsOpen=false" style="width:30px;height:30px;border-radius:50%;background:#F3F4F6;border:none;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#6B7280;">✕</button>
      </div>

      <div class="settings-row" @click="toggleEditMode();settingsOpen=false;">
        <div class="settings-icon" style="background:#EEF2FF;">✏️</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:#111827;">루틴 편집 모드</div>
          <div style="font-size:12px;color:#6B7280;">운동 추가·수정·삭제·순서 변경</div>
        </div>
        <div style="font-size:12px;font-weight:700;padding:4px 10px;border-radius:20px;" :style="editMode?'background:#EEF2FF;color:#4F46E5;':'background:#F3F4F6;color:#9CA3AF;'" x-text="editMode?'ON':'OFF'"></div>
      </div>

      <div class="settings-row" @click="jsonMode='export';jsonText=exportJSON();jsonPanelOpen=true;">
        <div class="settings-icon" style="background:#ECFDF5;">📤</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:#111827;">루틴 JSON 내보내기</div>
          <div style="font-size:12px;color:#6B7280;">현재 루틴을 JSON 텍스트로 복사</div>
        </div>
        <span style="color:#9CA3AF;font-size:16px;">›</span>
      </div>

      <div class="settings-row" @click="jsonMode='import';jsonText='';jsonPanelOpen=true;">
        <div class="settings-icon" style="background:#FFF7ED;">📥</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:#111827;">루틴 JSON 가져오기</div>
          <div style="font-size:12px;color:#6B7280;">JSON 텍스트를 붙여넣어 루틴 복구</div>
        </div>
        <span style="color:#9CA3AF;font-size:16px;">›</span>
      </div>

      <div class="settings-row" @click="resetRoutineConfirm()">
        <div class="settings-icon" style="background:#FEF2F2;">🔄</div>
        <div style="flex:1;">
          <div style="font-size:14px;font-weight:700;color:#EF4444;">기본 루틴으로 초기화</div>
          <div style="font-size:12px;color:#6B7280;">모든 커스텀 루틴을 제거합니다</div>
        </div>
        <span style="color:#9CA3AF;font-size:16px;">›</span>
      </div>

      <div x-show="jsonPanelOpen" style="margin-top:12px;background:#F9FAFB;border-radius:12px;padding:14px;border:1px solid #E5E7EB;">
        <div style="font-size:12px;font-weight:700;color:#374151;margin-bottom:8px;" x-text="jsonMode==='export'?'📤 아래 JSON을 복사하세요':'📥 JSON을 붙여넣고 가져오기를 누르세요'"></div>
        <textarea class="json-area" x-model="jsonText" :readonly="jsonMode==='export'" :placeholder="jsonMode==='import'?'JSON을 여기에 붙여넣으세요...':''"></textarea>
        <div style="display:flex;gap:8px;margin-top:8px;">
          <template x-if="jsonMode==='export'">
            <button @click="copyJSON()" style="flex:1;padding:10px;border-radius:10px;border:none;background:#111827;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">📋 복사</button>
          </template>
          <template x-if="jsonMode==='import'">
            <button @click="importJSON()" style="flex:1;padding:10px;border-radius:10px;border:none;background:#4F46E5;color:#fff;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">가져오기</button>
          </template>
          <button @click="jsonPanelOpen=false" style="padding:10px 14px;border-radius:10px;border:1.5px solid #E5E7EB;background:#fff;color:#6B7280;font-size:13px;font-weight:700;cursor:pointer;font-family:'Noto Sans KR',sans-serif;">닫기</button>
        </div>
      </div>
    </div>
  </div>

</div><!-- /main-app -->

  <!-- Home indicator (desktop only) -->
  <div id="phone-home"><div id="phone-home-bar"></div></div>

</div><!-- /phone-shell -->

<script src="app.js"></script>
</body>
</html>
